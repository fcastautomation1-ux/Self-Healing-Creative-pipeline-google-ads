[project]
name = "creative-pipeline-api"
version = "0.1.0"
description = "Autonomous Google Ads Asset Validator, Auto-Corrector, Smart Cropper & Filter Microservice"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pillow>=11.0.0",
    "opencv-python-headless>=4.10.0.84",
    "httpx>=0.28.0",
    "python-multipart>=0.0.18",
    "google-api-python-client>=2.150.0",
    "google-auth>=2.36.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/creative_pipeline"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
